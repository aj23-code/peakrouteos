# systemd feeds the machine's hardware watchdog while the system runs; when systemd itself, or the whole machine, stops answering for this
# long the hardware restarts it. Without a watchdog device this does nothing (systemd says so in the log once). Which driver a machine uses
# is up to its kernel: `ls /dev/watchdog*` shows whether there is one.
[Manager]
RuntimeWatchdogSec=30s
