# GRUB's configuration, on the EFI system partition next to grubenv (docs/updates.md, section 3). Written by the image build; an update of
# a slot never changes it, so both slots are always started the same way.
#
# grubenv holds   slot   the slot that is kept (a or b)
#                 trial  a slot to try once: it is read and cleared here, so a trial that is not kept lasts one start

set timeout=2
set default=0

load_env
if [ -z "${slot}" ]; then
    set slot=a
fi

set bootslot="${slot}"
set trying=
if [ -n "${trial}" ]; then
    set bootslot="${trial}"
    set trying=1
    set trial=
    save_env trial
fi

if [ "${bootslot}" = "a" ]; then
    set otherslot=b
else
    set otherslot=a
fi

# rootwait: a USB or slow disk may not be there yet. Both consoles: the screen, and a serial cable (115200 8N1) when there is one.
# panic=10: a kernel that panics restarts instead of hanging, so a version that cannot start goes back by itself.
function peakroute_start {
    if search --no-floppy --label --set=root "peakroute-root-$1"; then
        linux /vmlinuz root=LABEL=peakroute-root-$1 ro rootwait quiet panic=10 console=tty0 console=ttyS0,115200n8 peakroute.slot=$1 peakroute.trial=$2
        initrd /initrd.img
        boot
    fi
}

# the slot chosen above; if it cannot be started (no such slot yet), the other one
menuentry "PeakRoute OS (slot ${bootslot})" {
    peakroute_start "${bootslot}" "${trying}"
    peakroute_start "${otherslot}" ""
}

menuentry "PeakRoute OS (the other slot, ${otherslot})" {
    peakroute_start "${otherslot}" ""
}
