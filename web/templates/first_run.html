<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakRoute OS — Initial Setup</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="header">
                <h1>PeakRoute OS</h1>
                <p>Admin Account Onboarding</p>
            </div>

            {{if .Error}}
            <div class="error-msg">{{.Error}}</div>
            {{end}}

            <form action="/api/v1/setup/apply" method="POST">
                <div class="field-group">
                    <label for="username">Admin Username</label>
                    <input type="text" id="username" name="username" value="admin" required placeholder="admin" autofocus />
                </div>

                <div class="field-group">
                    <label for="password">Admin Password</label>
                    <input type="password" id="password" name="password" required placeholder="Set strong password" />
                </div>

                <button type="submit" class="btn-submit">Complete Setup</button>
            </form>
        </div>
    </div>
</body>
</html>
