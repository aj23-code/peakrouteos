name: release
# Pushing a version tag (v0.10.0, v0.11.0-beta) builds the image and the update bundle and attaches them to a GitHub release
# (docs/updates.md, section 7). A tag with a hyphen is a pre-release: devices only offer it when "include pre-releases" is on.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Checks
        run: ./check.sh
      - name: Vulnerability check (Go's known vulnerabilities, in the standard library and in what we import, that the code can reach)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Make room (the build needs about 9 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Tools of the image build
        run: sudo apt-get update && sudo apt-get install -y debootstrap fdisk dosfstools e2fsprogs wget pigz
      - name: Build the image and the update bundle
        env:
          VERSION: ${{ github.ref_name }}
          UPDATE_REPO: ${{ github.repository }}
          UPDATE_NOTES: Release ${{ github.ref_name }}
        run: ./full_build.sh
      - name: Package
        run: |
          mkdir -p dist
          # every file is named for the product (os: the router), its processors and its board: peakroute-os-amd64-generic-<tag>
          name="peakroute-os-amd64-generic-${GITHUB_REF_NAME}"
          mv "${name}.update" "${name}.update.sha256" dist/
          # a release file may be at most 2 GiB: the disk image is mostly empty space and compresses far below that
          pigz -6 -c peakroute-os.img > "dist/${name}.img.gz"
          ( cd dist && sha256sum "${name}.img.gz" > "${name}.img.gz.sha256" )
          ls -lh dist
      - name: Sign (the routers only install what this key signed, see docs/updates.md)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          name="peakroute-os-amd64-generic-${GITHUB_REF_NAME}"
          go run ./cmd/peakroute-sign sign "dist/${name}.update" "dist/${name}.img.gz"
          # the signature must be one the software built from this tag accepts, so a wrong key is found now and not on a router
          go run ./cmd/peakroute-sign verify "dist/${name}.update" "dist/${name}.img.gz"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --title "PeakRoute OS ${GITHUB_REF_NAME}" --notes-file .github/release-notes.md --generate-notes ${flags}
