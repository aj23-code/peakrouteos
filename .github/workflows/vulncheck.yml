name: vulncheck
# Looks for known vulnerabilities in the Go the software is built with and in the packages it uses, that the code can reach. The release
# workflows run the same check before they build; this one also runs every week and when a change is pushed, so that a vulnerability
# announced between releases is seen, and a failed run is the reminder to raise the Go version in go.mod (docs/security.md).
on:
  push:
    branches: [master]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
